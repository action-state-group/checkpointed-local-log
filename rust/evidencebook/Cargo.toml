[package]
name = "evidencebook"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Evidence book: records, epistemic types, typed links, retention, disclosure, index classes, request answers and reconcile/close over an embedded Checkpointed Local Log -- a Rust implementation of the Evidence Layer semantics."
repository = "https://github.com/action-state-group/checkpointed-local-log"
keywords = ["evidence", "mmr", "checkpoint", "scitt"]
categories = ["cryptography"]
publish = false

[lib]
name = "evidencebook"
path = "src/lib.rs"

[dependencies]
cll = { path = "../cll" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
