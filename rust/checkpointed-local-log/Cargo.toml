[package]
# Published as `checkpointed-local-log` (the name `cll` is taken on crates.io);
# the library keeps the name `cll`, so `use cll::...` is unchanged.
name = "checkpointed-local-log"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Checkpointed Local Log (CLL): Merkle Mountain Range, signed COSE checkpoints, per-record range proofs, and witness registration -- a Rust sibling of the checkpointed-local-log Python reference, sharing its conformance vectors."
repository = "https://github.com/action-state-group/checkpointed-local-log"
keywords = ["scitt", "mmr", "merkle", "checkpoint"]
categories = ["cryptography"]
readme = "README.md"
documentation = "https://docs.rs/checkpointed-local-log"
# The package carries the library only: the tests and examples read the
# conformance vectors from the repository root, which does not ship. The one
# exception is the pinned copy of backend-conformance-vectors/vectors.json that
# `cll::log::conformance` embeds, so user-written backends can run it.
include = ["src/**/*.rs", "src/log/conformance/vectors.json", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-APACHE"]

[lib]
name = "cll"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
coset = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
thiserror = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
# Database drivers stay optional: default features load none of them.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
mysql = { version = "28", default-features = false, features = ["minimal-rust"], optional = true }

[target.'cfg(unix)'.dependencies]
# flock(2) on the JSONL journal descriptor (`cll::log::jsonl`).
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
# Gates `tests/scitt_cose_receipt_interop.rs`, which shells out to the
# Python reference's `reference_verifier.py` (no Rust scitt-cose verifier
# exists yet). Off by default so a plain `cargo test` doesn't require a
# Python environment; CI's rust-test job sets one up and runs with
# `--all-features`.
python-interop-tests = []
# `cll::log::sqlite`: the shared relational schema on SQLite (bundled).
sqlite = ["dep:rusqlite"]
# `cll::log::mysql`: the shared relational schema on MySQL 8.
mysql = ["dep:mysql"]

[[test]]
name = "scitt_cose_receipt_interop"
required-features = ["python-interop-tests"]

# The storage-interop driver for go/scripts/check-storage-interop.sh.
[[example]]
name = "storage_interop"
required-features = ["sqlite", "mysql"]
