[package]
name = "cll"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Checkpointed Local Log (CLL): Merkle Mountain Range, signed COSE checkpoints, per-record range proofs, and witness registration -- a Rust sibling of the checkpointed-local-log Python reference, sharing its conformance vectors."
repository = "https://github.com/action-state-group/checkpointed-local-log"
keywords = ["scitt", "mmr", "merkle-mountain-range", "merkle", "checkpoint"]
categories = ["cryptography"]
publish = false

[lib]
name = "cll"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
coset = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
thiserror = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[features]
# Gates `tests/scitt_cose_receipt_interop.rs`, which shells out to the
# Python reference's `reference_verifier.py` (no Rust scitt-cose verifier
# exists yet). Off by default so a plain `cargo test` doesn't require a
# Python environment; CI's rust-test job sets one up and runs with
# `--all-features`.
python-interop-tests = []

[[test]]
name = "scitt_cose_receipt_interop"
required-features = ["python-interop-tests"]
