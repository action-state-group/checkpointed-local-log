# SPDX-License-Identifier: BSD-3-Clause
# Build the Internet-Draft from kramdown-rfc source and verify the tracked
# .xml / .txt artifacts are not stale: build to temp outputs and diff against
# the committed files so a no-op make cannot silently pass stale artifacts.
#
# Ported from action-state-group/scitt-payload-binding, with one addition this
# repository requires — see "Intended status" in the normalization block below.
#
# Normalization: kramdown-rfc embeds a Ruby-version stamp in a generator comment
# (e.g. "generated by … (Ruby 4.0.5)") that varies by platform.  That line is
# stripped from both sides before diffing so the check is environment-agnostic.
name: spec

on:
  push:
    paths: ["spec/**", ".github/workflows/spec.yml"]
  pull_request:
    paths: ["spec/**", ".github/workflows/spec.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: install toolchain
        run: |
          gem install kramdown-rfc
          python -m pip install xml2rfc

      - name: build draft to temp + diff against tracked artifacts
        working-directory: spec
        run: |
          DRAFT=$(grep '^DRAFT[[:space:]]*=' Makefile | sed 's/^DRAFT[[:space:]]*=[[:space:]]*//')
          echo "DRAFT=$DRAFT" >> "$GITHUB_ENV"
          echo "Gating revision: $DRAFT"
          mkdir -p _ci_build
          kramdown-rfc "$DRAFT.md" > _ci_build/.draft.v2.xml
          xml2rfc --v2v3 _ci_build/.draft.v2.xml -o _ci_build/"$DRAFT.xml"
          xml2rfc --text --v3 _ci_build/"$DRAFT.xml" -o _ci_build/"$DRAFT.txt"
          rm -f _ci_build/.draft.v2.xml
          # Normalize out build-date-dependent content before diffing.
          # xml2rfc derives an expiry date (build date + 6 months) that appears in
          # both the XML <date> element and as "Expires …" text in the .txt output.
          # Strip those on both sides so the check is insensitive to build day.
          strip_xml() {
            grep -v 'generated by.*kramdown-rfc' | \
            sed 's/<date year="[^"]*" month="[^"]*" day="[^"]*"\/>/<date\/>/g'
          }
          strip_txt() {
            # Normalize ONLY the build-day-derived date locations in RFC .txt output.
            # Bibliographic reference dates (e.g. "17 August 2026" in [soos-gar-05])
            # are content-derived — do NOT normalise them so a stale reference goes RED.
            #
            # The "Intended status" rule is this repository's addition and is not in
            # the upstream CPB gate.  With two authors, xml2rfc puts the build date on
            # a line of its own, which the standalone-date rule below catches.  This
            # draft has ONE author, so the date is laid out inline on the
            # "Intended status:" line instead and that rule never sees it.  Without
            # this rule the gate silently ignores a whole class of drift here.
            #
            # The final rule collapses whitespace runs on lines a date rule already
            # touched.  xml2rfc right-pads these lines to a fixed column, so the date's
            # own WIDTH shifts the padding: "25 August 2026" is one character longer
            # than "5 August 2026", moving the padding by one space.  Replacing the
            # date text alone leaves that shift behind, which would make the gate pass
            # or fail according to the day of the month rather than according to
            # staleness.  Only already-normalised lines are collapsed, so page numbers
            # and every content line stay compared byte-for-byte.
            sed \
              -e 's/^Expires: [0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9]/Expires: DATE_NORM/' \
              -e 's/expire on [0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9]/expire on DATE_NORM/' \
              -e 's/Expires [0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9]  *\[Page/Expires DATE_NORM [Page/' \
              -e 's/^\(Intended status:.*[A-Za-z]\)  *[0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9] *$/\1 DATE_NORM/' \
              -e '/^ *[0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9] *$/s/.*/DATE_NORM/' \
              -e '/DATE_NORM/s/  */ /g'
          }
          diff <(strip_xml < "$DRAFT.xml") <(strip_xml < _ci_build/"$DRAFT.xml") \
            || { echo "STALE: $DRAFT.xml is out of date — run 'make' locally and commit"; exit 1; }
          diff <(strip_txt < "$DRAFT.txt") <(strip_txt < _ci_build/"$DRAFT.txt") \
            || { echo "STALE: $DRAFT.txt is out of date — run 'make' locally and commit"; exit 1; }

      - name: assert RFCXML v3
        working-directory: spec
        run: grep -q 'version="3"' _ci_build/"${DRAFT}.xml"

      - name: idnits
        working-directory: spec
        run: npx --yes @ietf-tools/idnits _ci_build/"${DRAFT}.txt" || true
