# Publishes ts/ (@action-state-group/cll) to npm via OIDC trusted publishing
# for a ts/v<version> tag, which tag-release.yml creates when a version bump
# merges. See RELEASING.md.
name: Publish TypeScript package

on:
  release:
    types: [published]
  # tag-release.yml dispatches this on the ts/v<version> tag it creates.
  workflow_dispatch: {}

permissions:
  contents: read

# One group per tag: a shared group keeps only one pending run and would
# cancel a queued publish for another version.
concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Only a ts/v tag publishes: a published GitHub Release for it, or a
    # dispatch on it. The guard below and the npm environment's ts/v* tag rule
    # refuse anything else.
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'ts/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/ts/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    defaults:
      run:
        working-directory: ts
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require a matching tag on main
        working-directory: .
        run: python .github/release.py check ts "$RELEASE_TAG"

      - name: Require the expected package and a consistent lockfile
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          assert.equal(pkg.name, "@action-state-group/cll");
          assert.equal(lock.name, pkg.name);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[""].name, pkg.name);
          assert.equal(lock.packages[""].version, pkg.version);
          JS

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check
        env:
          CLL_ROOT: ..

      - name: Build package
        run: npm run build

      - name: Keep prereleases off the latest dist-tag
        # npm refuses a prerelease without an explicit dist-tag.
        run: |
          case "$(node -p "require('./package.json').version")" in
            *-*) echo "DIST_TAG=next" >> "$GITHUB_ENV" ;;
            *) echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      - name: Publish package if needed
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >published-version.txt 2>view-error.txt; then
            test "$(cat published-version.txt)" = "$package_version"
            # A version npm already has must come from this tag's commit;
            # otherwise the release would describe code npm does not serve.
            published_head=$(npm view "$package_name@$package_version" gitHead)
            if [ "$published_head" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$package_name@$package_version on npm was built from ${published_head:-an unknown commit}, not $(git rev-parse HEAD)" >&2
              exit 1
            fi
            echo "$package_name@$package_version is already published from this commit; skipping npm publish."
          elif grep -q "E404" view-error.txt; then
            npm publish --tag "$DIST_TAG"
          else
            cat view-error.txt >&2
            exit 1
          fi
