name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "npm releases must run from main." >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check
        env:
          CLL_ROOT: ..

      - name: Build package
        run: npm run build

      - name: Publish package if needed
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$package_name" = "@action-state-group/cll"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

          if npm view "$package_name@$package_version" version >published-version.txt 2>view-error.txt; then
            test "$(cat published-version.txt)" = "$package_version"
            echo "$package_name@$package_version is already published; skipping npm publish."
            echo "published_now=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" view-error.txt; then
            npm publish
            echo "published_now=true" >> "$GITHUB_OUTPUT"
          else
            cat view-error.txt >&2
            exit 1
          fi

      - name: Tag published commit
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.publish.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.package_version }}
          PUBLISHED_NOW: ${{ steps.publish.outputs.published_now }}
        shell: bash
        run: |
          tag="ts/v$PACKAGE_VERSION"
          if [[ "$PUBLISHED_NOW" = "true" ]]; then
            published_git_head="$GITHUB_SHA"
          else
            published_git_head=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead)
          fi
          if [[ "$published_git_head" != "$GITHUB_SHA" ]]; then
            echo "Published gitHead differs from this candidate." >&2
            exit 1
          fi
          if [[ -z "$published_git_head" ]]; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION does not expose gitHead." >&2
            exit 1
          fi

          remote_tag=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -n "$remote_tag" ]]; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$published_git_head"
            echo "$tag already points to the npm-published commit."
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$tag" \
                --notes "npm release $PACKAGE_NAME@$PACKAGE_VERSION"
            fi
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$published_git_head" \
              --title "$tag" \
              --notes "npm release $PACKAGE_NAME@$PACKAGE_VERSION"
          fi

          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-list -n 1 "$tag")" = "$published_git_head"
