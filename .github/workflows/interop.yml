name: Same-revision interoperability
# Pull requests do not run this workflow, to keep their job count small.
# The interoperability check runs nightly, on push to main when its inputs change, and
# by hand; scripts/check.sh runs it locally before a push (CLAUDE.md).
on:
  push:
    branches: [main]
    paths: ["go/**", "ts/**", "python/**", "*-vectors/**", ".github/scripts/check_checkpoint_interop.sh", ".github/scripts/use-node-headers.sh", ".github/workflows/interop.yml"]
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
# Pull request runs share a group per ref and cancel older runs; every other
# run gets its own group, so a main or nightly run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checkpoint-interop:
    name: Checkpoint interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build native addons against this Node.js's own headers
        run: bash .github/scripts/use-node-headers.sh
      - name: Build destination TypeScript
        run: npm ci && npm run build
        working-directory: ts
      - name: Install destination Python
        run: python -m pip install ./python
      - name: Verify Go, TypeScript, and Python checkpoint bytes
        shell: bash
        run: bash .github/scripts/check_checkpoint_interop.sh

  # A red run on main or a nightly opens or comments on one ci-red issue.
  report-failure:
    needs: [checkpoint-interop]
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Same-revision interoperability failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
