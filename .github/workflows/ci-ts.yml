name: TypeScript CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ts
env:
  CLL_ROOT: ..
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm run build
        working-directory: ts
      - run: npx vitest run --coverage --exclude test/mysql.test.ts
        working-directory: ts

  mysql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npx vitest run test/mysql.test.ts

  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci && npm run build
      - name: Install packed artifact and import every entry point
        shell: bash
        run: |
          package_dir=$(mktemp -d)
          consumer_dir=$(mktemp -d)
          trap 'rm -rf "$package_dir" "$consumer_dir"' EXIT
          npm pack --pack-destination "$package_dir"
          cd "$consumer_dir"
          npm init -y
          npm install "$package_dir"/*.tgz
          node -e 'await import("@action-state-group/cll"); await import("@action-state-group/cll/jsonl"); await import("@action-state-group/cll/sqlite"); await import("@action-state-group/cll/mysql")'
          node --conditions=browser -e 'await import("@action-state-group/cll")'
