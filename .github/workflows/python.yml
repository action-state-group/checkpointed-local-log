name: Python CI

# The Python reference's own tests. Runs on every push to main and on pull
# requests that touch its inputs: the package is the reference the conformance
# vectors are generated from, and its tests exercise the agent-action-capsule
# release pip resolves today, so a change there that breaks them shows up on
# the next main run.

on:
  push:
    branches: [main]
  # Pull requests run this workflow only when they touch its inputs.
  pull_request:
    paths: ["python/**", "*-vectors/**", ".github/*.py", ".github/leak_lint_allowlist.txt", ".github/releases.json", ".github/scripts/check_python_package.sh", ".github/scripts/check_python_inventory.py", ".github/scripts/test_python_inventory.py", "scripts/check.sh", ".github/workflows/python.yml"]

# Pull request runs share a group per ref and cancel older runs; every other
# run gets its own group, so a main or nightly run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    # ubuntu-latest moved to 26.04, whose tool cache has no Python 3.9, the
    # oldest version the package supports; 24.04 still has it.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the package supports, and a current one.
        python-version: ["3.9", "3.12"]
    # The cll.log MySQL backend tests run against a real server. They read
    # CLL_MYSQL_URL and fail rather than skip when CI is set without it.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: python
          MYSQL_DATABASE: cll
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppython --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    env:
      CLL_MYSQL_URL: mysql://root:python@127.0.0.1:3306/cll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install checkpointed-local-log (dev)
        run: python -m pip install -e ".[dev,mysql]"

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        run: python -m pytest -q

      - name: cll and cll.log load no database driver
        run: >-
          python -c "import sys, cll, cll.log;
          loaded = [m for m in ('sqlite3', 'pymysql') if m in sys.modules];
          assert not loaded, loaded"

      # The leak-lint tests live next to the lint in .github/, outside the test paths. They use
      # synthetic terms only, so this pull_request job needs no secret.
      - name: leak-lint tests
        run: python -m pytest -q ../.github/test_leak_lint.py

      - name: Release helper tests
        run: python -m pytest -q ../.github/test_release.py

      - name: scripts/check.sh orchestration tests
        run: python -m pytest -q ../.github/test_check_script.py

      - name: Source, editable, wheel and sdist package checks
        run: |
          python -m pip install build
          bash ../.github/scripts/check_python_package.sh

  # A red run on main opens or comments on one ci-red issue.
  report-failure:
    needs: [test]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the failure
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Python CI failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
