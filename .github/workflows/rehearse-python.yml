# SPDX-License-Identifier: Apache-2.0
# Manual TestPyPI rehearsal only. Production publication uses publish-python.yml.
name: rehearse-python
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate the selected candidate is on main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install build twine
      - name: Validate and retain rehearsal packages
        run: |
          bash .github/scripts/check_python_package.sh "$GITHUB_WORKSPACE/rehearsal-dist"
          python -m twine check rehearsal-dist/*
          sha256sum rehearsal-dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-candidate
          path: rehearsal-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: rehearsal-dist/
