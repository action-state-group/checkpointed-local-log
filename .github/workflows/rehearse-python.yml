# SPDX-License-Identifier: Apache-2.0
# Manual TestPyPI rehearsal only. Production publication uses publish-python.yml.
name: rehearse-python
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the selected candidate is on main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install build twine
      - name: Validate and retain rehearsal packages
        run: |
          bash .github/scripts/check_python_package.sh "$GITHUB_WORKSPACE/rehearsal-dist"
          python -m twine check rehearsal-dist/*
          sha256sum rehearsal-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-candidate
          path: rehearsal-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: rehearsal-dist/
