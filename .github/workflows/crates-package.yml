# SPDX-License-Identifier: Apache-2.0
# crates-package: the checkpointed-local-log crate packages cleanly for
# crates.io.
#
# The package's file list is checked (the library, its README and CHANGELOG,
# and the pinned backend conformance vectors that `cll::log::conformance`
# embeds; never tests, other vectors, keys or build output), then
# `cargo publish --dry-run` builds the packaged crate against crates.io.
# Nothing is uploaded. (evidencebook moved to its own repository.)
name: Crate packaging

# Pull requests do not run this workflow, to keep their job count small.
# The packaging check runs nightly, on push to main when its inputs change, and
# by hand; scripts/check.sh runs it locally before a push (CLAUDE.md).
on:
  push:
    branches: [main]
    paths: ["rust/**", "*-vectors/**", ".github/scripts/test_crate_availability.sh", ".github/scripts/check_crate_availability.sh", ".github/scripts/check_crate_metadata.py", ".github/workflows/crates-package.yml"]
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pull request runs share a group per ref and cancel older runs; every other
# run gets its own group, so a main or nightly run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Registry availability guard tests
        run: bash .github/scripts/test_crate_availability.sh

      - name: crates.io metadata (keywords, categories, required fields)
        run: python3 .github/scripts/check_crate_metadata.py rust/checkpointed-local-log/Cargo.toml

      - name: package file lists
        working-directory: rust
        run: |
          set -euo pipefail
          for crate in checkpointed-local-log; do
            cargo package --list --allow-dirty -p "$crate" > "/tmp/$crate.list"
            echo "== $crate"; cat "/tmp/$crate.list"
            # The one vector file a crate may ship: the pinned copy the
            # conformance runner embeds with include_str!.
            if grep -v '^src/log/conformance/vectors\.json$' "/tmp/$crate.list" |
              grep -E '^(tests|examples|scripts|target)/|vectors|\.(pem|key|env)$'; then
              echo "::error::$crate packages a file it must not ship"; exit 1
            fi
          done

      - name: checkpointed-local-log dry run
        working-directory: rust
        run: cargo publish --dry-run --allow-dirty -p checkpointed-local-log

  # A red run on main or a nightly opens or comments on one ci-red issue.
  report-failure:
    needs: [package]
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Crate packaging failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
