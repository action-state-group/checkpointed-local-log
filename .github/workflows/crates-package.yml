# SPDX-License-Identifier: Apache-2.0
# crates-package: the two Rust crates package cleanly for crates.io.
#
# For each crate, the package's file list is checked (the library, its README
# and CHANGELOG, and for evidencebook the vendored schema it embeds; never
# tests, vectors, keys or build output), then `cargo publish --dry-run` builds
# the packaged crate against crates.io. Nothing is uploaded.
#
# evidencebook depends on checkpointed-local-log by version. Until that version
# is on crates.io, its dry run cannot resolve it, so the two crates are instead
# packaged together in a temporary workspace for local compatibility coverage.
# That fallback does not establish registry resolution or publication readiness.
name: crates-package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Registry availability guard tests
        run: bash .github/scripts/test_crate_availability.sh

      - name: crates.io metadata (keywords, categories, required fields)
        run: python3 .github/scripts/check_crate_metadata.py rust/Cargo.toml evidencebook/Cargo.toml

      - name: package file lists
        run: |
          set -euo pipefail
          for crate in rust evidencebook; do
            (cd "$crate" && cargo package --list --allow-dirty) > "/tmp/$crate.list"
            echo "== $crate"; cat "/tmp/$crate.list"
            if grep -E '^(tests|examples|scripts|target)/|vectors|\.(pem|key|env)$' "/tmp/$crate.list"; then
              echo "::error::$crate packages a file it must not ship"; exit 1
            fi
          done

      - name: checkpointed-local-log dry run
        working-directory: rust
        run: cargo publish --dry-run --allow-dirty

      - name: evidencebook dry run
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          if bash .github/scripts/check_crate_availability.sh checkpointed-local-log "$version"; then
            echo "Registry-backed EvidenceBook verification BLOCKED: checkpointed-local-log $version is absent."
            echo "Packaging both crates only for local compatibility coverage."
            ws=$(mktemp -d)
            cp -R rust evidencebook "$ws/"
            rm -f "$ws/rust/Cargo.lock" "$ws/evidencebook/Cargo.lock"
            printf '[workspace]\nmembers = ["rust", "evidencebook"]\nresolver = "2"\n' > "$ws/Cargo.toml"
            (cd "$ws" && cargo package --workspace --allow-dirty)
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
            (cd evidencebook && cargo publish --dry-run --allow-dirty)
          fi
