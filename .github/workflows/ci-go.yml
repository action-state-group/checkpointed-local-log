name: Go CI
env:
  CI: "true"

on:
  push:
    branches: [main]
  # Pull requests run this workflow only when they touch its inputs.
  pull_request:
    paths: ["go/**", "*-vectors/**", "ts/test/testdata/runner-vectors.json", ".github/workflows/ci-go.yml"]

permissions:
  contents: read

# Pull request runs share a group per ref and cancel older runs; every other
# run gets its own group, so a main or nightly run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: go

jobs:
  # One job, so a run takes one runner slot instead of three: on a busy
  # organization each job waits for its own runner (issue #152).
  test:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: setup
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      # Each check below runs even after an earlier one failed, so one run
      # reports every failure as the separate jobs did.
      - name: Check formatting and module files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: go vet ./...
      - name: Runner vectors are current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: go run ./test/runnervectors -check
      - name: Unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: go test ./...
      - name: Race tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: go test -race ./...

  # A red run on main opens or comments on one ci-red issue.
  report-failure:
    needs: [test]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the failure
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Go CI failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
