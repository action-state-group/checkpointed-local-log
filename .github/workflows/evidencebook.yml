# SPDX-License-Identifier: Apache-2.0
# Builds and tests the `evidencebook` Rust crate (evidencebook/), which
# embeds the `cll` crate beside it, so a change to either triggers it. Also
# runs the crate's vocabulary gate: the crate carries no deployment
# vocabulary, and scripts/check-vocabulary.sh fails the build if any appears.
name: evidencebook CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidencebook-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidencebook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: vocabulary gate
        run: ./scripts/check-vocabulary.sh

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: cargo doc (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
