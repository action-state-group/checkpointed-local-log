# SPDX-License-Identifier: Apache-2.0
# Builds and tests the Rust workspace (rust/): the `checkpointed-local-log`
# crate (library `cll`, rust/checkpointed-local-log/), including its pass over
# the shared cross-language conformance vectors (mmr-conformance-vectors/,
# commitment-conformance-vectors/, checkpoint-conformance-vectors/). Also
# runs the Python reference_verifier.py scripts for those same vector sets,
# so a divergence between the Python reference and the Rust port is caught
# by CI on either side, not just locally.
#
# rust-test installs the Python dev environment too: `cargo test
# --all-features` enables `scitt_cose_receipt_interop.rs`, which shells out
# to `checkpoint-conformance-vectors/reference_verifier.py` (no Rust
# scitt-cose verifier exists yet) to check the witness-receipt boundary.
#
# The MySQL 8.4 service backs the `cll::log::mysql` tests: with `CI` set they
# fail rather than skip when CLL_MYSQL_URL is missing.
name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rust
          MYSQL_DATABASE: cll
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prust --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: install checkpointed-local-log (dev)
        run: python -m pip install -e "./python[dev]"

      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: rust
        env:
          CLL_MYSQL_URL: mysql://root:rust@127.0.0.1:3306/cll
        run: cargo test --all-features

      - name: cargo test (default features)
        working-directory: rust
        run: cargo test

      - name: cargo doc (warnings are errors)
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  cross-language-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: install checkpointed-local-log (dev)
        run: python -m pip install -e "./python[dev]"

      - name: mmr + commitment conformance vectors (Python reference)
        run: |
          python3 mmr-conformance-vectors/reference_verifier.py
          python3 commitment-conformance-vectors/reference_verifier.py
          python3 checkpoint-conformance-vectors/reference_verifier.py

      - name: trait-signed checkpoint verifies under the Python reference
        working-directory: rust
        run: |
          cargo run --quiet -p checkpointed-local-log --example trait_signed_checkpoint | \
            python3 ../checkpoint-conformance-vectors/verify_trait_signed_cose.py
