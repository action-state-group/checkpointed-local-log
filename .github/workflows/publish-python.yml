# SPDX-License-Identifier: Apache-2.0
# Publishes python/ to PyPI via OIDC trusted publishing for a python/v<version>
# tag, which tag-release.yml creates when a version bump merges. See RELEASING.md.
name: Publish Python package
on:
  release:
    types: [published]
  # tag-release.yml dispatches this on the python/v<version> tag it creates.
  # Dispatched on a branch, it does nothing.
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  publish:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'python/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/python/v'))
    runs-on: ubuntu-latest
    # The PyPI Trusted Publisher requires this environment, which only
    # python/v* tags may deploy to.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a matching tag on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python .github/release.py check python "$RELEASE_TAG"
      - run: python -m pip install build
      - run: python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
