# SPDX-License-Identifier: Apache-2.0
name: Publish Python package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing python/v<version> tag to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'python/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python tag, metadata and intended ref
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python .github/scripts/check_python_release.py "$RELEASE_TAG" python/pyproject.toml
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
            test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          fi
      - run: python -m pip install build
      - run: python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
