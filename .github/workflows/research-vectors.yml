name: External MMR profile research vectors
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install './python[dev]'
      - run: python mmr-profile-vectors/generate.py --check
      - run: python -m pytest tests/checkpoint/test_mmr_profile_vectors.py
        working-directory: python
