name: External MMR profile research vectors
# Pull requests do not run this workflow, to keep their job count small.
# Regenerating the research vectors runs nightly, on push to main when its inputs change, and
# by hand; scripts/check.sh runs it locally before a push (CLAUDE.md).
on:
  push:
    branches: [main]
    paths: ["python/**", "*-vectors/**", ".github/workflows/research-vectors.yml"]
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
# Pull request runs share a group per ref and cancel older runs; every other
# run gets its own group, so a main or nightly run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install './python[dev]'
      - run: python mmr-profile-vectors/generate.py --check
      - run: python cll-02-vectors/generate.py --check
      - run: python backend-conformance-vectors/generate.py --check
      - run: python checkpoint-conformance-vectors/generate_ed25519.py --check
      - run: python checkpoint-conformance-vectors/generate_receipts.py --check
      - run: python -m pytest tests/checkpoint/test_mmr_profile_vectors.py
        working-directory: python

  # A red run on main or a nightly opens or comments on one ci-red issue.
  report-failure:
    needs: [reproduce]
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "External MMR profile research vectors failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
